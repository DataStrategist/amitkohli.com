	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};


        </script>

## GPT-5 doesn't know:
- your definition of *"incident"*
- that *"active"* means something specific here
- that *"final version"* is a process, not a filename

<aside class="notes"><p><strong>New hire analogy / no brief no context / meaning not numbers</strong></p>
<p>You wouldn&#39;t give a new hire a task with no brief, no context, no examples, no sense of what &quot;done&quot; looks like - and be surprised when they got it wrong. Raw data has no domain context. It doesn&#39;t know it&#39;s Friday. It doesn&#39;t know three sessions is your threshold. The numbers exist. The meaning doesn&#39;t.</p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

<aside class="notes"><p><strong>No title, let diagram breathe / this filename is real / buried vs findable</strong></p>
<p>Say the heading live instead of showing it: &quot;final_v2_REAL_final.xlsx.&quot; This filename pattern shows up constantly. Somewhere in your organisation there&#39;s a spreadsheet exactly like this: badly named, three folders deep, encoding real domain knowledge that only one person can find. Doesn&#39;t matter how good the AI is - if a human can&#39;t reliably find it, neither can the system. Left side: buried and unreachable. Right side: the same information, tied to a stated organisational function, so it&#39;s findable.</p>

<p>You don&#39;t need a formal data dictionary to start. The cheap version: write down what your organisation actually does - its functions, its mandates - then write down which folder or dataset fulfils each one. That mapping alone is most of the value, and it costs an afternoon, not a project.</p>

<div class="mermaid">

flowchart LR

    I --> R["Repository"]

<aside class="notes"><p><strong>Strategy is also data / objective to initiative to repository to data</strong></p>
<p>Say it as the heading: &quot;your strategy is also data.&quot; If your org&#39;s priorities and direction live in someone&#39;s head or an unfindable PDF, your AI has no organisational memory to draw on. Trace it all the way down: a strategic objective drives an initiative, an initiative produces or lives in a repository, and a repository holds the actual data. If any link in that chain isn&#39;t written down and findable, AI can&#39;t trace back to why the data exists at all.</p>

<aside class="notes"><p><strong>Jacob&#39;s girlfriend story / silos are political / AI reproduces access patterns</strong></p>
<p>The only reason anyone in the org can get current financial data is because Jacob in accounts is dating someone who knows the data engineer, who drops it as a CSV when he gets a chance. Silos are political, not technical. AI faithfully reproduces whatever access pattern already exists - so siloed data stays siloed, and AI is missing context it doesn&#39;t even know it&#39;s missing.</p>

## Amit Kohli ≠ A. Kohli

- Same concept, different definition

<aside class="notes"><p><strong>ID resolution / combining entities / governance: definitions drift / temporal mismatch</strong></p>
<p>Simple example: &quot;Amit Kohli&quot; in one system, &quot;A. Kohli&quot; in another, a typo in a third - is that one person or three? Integrating data means combining entities that should be the same but don&#39;t look the same. The governance point underneath: even once you match the person correctly, &quot;active,&quot; &quot;closed,&quot; &quot;resolved&quot; might not mean the same thing in the two source tables you just merged. And a third layer: combining data collected in different time periods brings its own risk - definitions and processes drift over time, so a 2019 record and a 2024 record labelled the same thing may not actually be comparable.</p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Problem 2: sensitive documents surface.

<p class="fragment" style="text-align:center; font-size:1.3em; margin-top:0.3em">Because security by obfuscation is <mark>over</mark>.</p>

<aside class="notes"><p><strong>Problem stated / fragment reveals obfuscation principle / board papers, HR files, 2021 permissions</strong></p>
<p>A separate problem from version confusion - board papers, HR files, anything &quot;protected&quot; only by being hard to find, now one Copilot search away from anyone with baseline access. Click for the fragment. Most orgs protect sensitive information by making it hard to find, not by actually restricting who can see it. SharePoint permissions that haven&#39;t been reviewed since 2021. AI doesn&#39;t respect obscurity - it surfaces everything it can technically reach.</p>

## Fix for both: metadata tagging

*(huge, continuous task - realistically out of reach for most charities right now)*

<aside class="notes"><p><strong>Same fix for both problems / status, date, sensitivity, owner / honest about the cost</strong></p>
<p>The fix for version confusion and for sensitive-document exposure is the same thing: proper metadata - status, date, sensitivity, owner - tagged on every document. Just say it plainly - it&#39;s a large, ongoing task, not a one-off project, and for most charities&#39; current resourcing it&#39;s a genuine stretch.</p>

<aside class="notes"><p><strong>Blast radius / every link in the chain / stolen laptop = real everyday risk</strong></p>
<p>Not just your own security posture - every vendor and every device in the chain. If any link is compromised - your systems, the AI vendor&#39;s systems, or literally a stolen laptop with an active session - what can that compromised link now do on your behalf? Connecting a folder to AI doesn&#39;t just add a capability, it adds an attack surface.</p>

## Introduction to Retrieval Augmented Generation (RAG)

<aside class="notes"><p><strong>Section header verbatim / 5 min / no interactive moment</strong></p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div class="mermaid">

flowchart LR
    D["Documents"] -->|split into| C["Chunks"]
    C -->|convert to numbers| V[("Vector DB")]
    Q["Question"] -->|also converted| V
    V -->|most similar chunks| R["Retrieved chunks"]
    R --> LLM["LLM"]
    Q --> LLM
    LLM --> A["Answer"]

</div>


<aside class="notes"><p><strong>RAG architecture / chunks to vectors to retrieval to answer / meaning-distance not keyword search</strong></p>
<p>Documents get split into chunks - paragraphs, roughly. Each chunk becomes a vector of numbers. A question becomes a vector too. The system finds chunks whose vectors are closest to the question&#39;s vector. Those chunks go to the model with the question, and it generates an answer grounded in them. This is meaning-distance in mathematical space, not keyword search - and it&#39;s a completely different system from &quot;AI reading your SharePoint,&quot; even though it often starts with the same documents.</p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## What goes wrong:

| Problem | What it looks like |
|---|---|
| Corpus imbalance | Janice in accounts has 200 docs. Policy team has 3. AI thinks Janice is the expert. |
| Source confusion | 2019 policy and 2024 update treated as equally valid |
| Recency failure | AI mixes chunks from 2007 and 2023 |
| No metadata | Can't filter, can't sort, can't control |
| Chunks lose position | A heading like "DO NOT" doesn't survive chunking - meaning can flip |
| Hallucination survives | Grounding doesn't stop the model inventing beyond the chunks |
| Plagiarism risk | Verbatim text lifted from source unless explicitly prompted against |

<aside class="notes"><p><strong>7 failure modes / Janice example / DO NOT chunking / hallucination survives grounding</strong></p>
<p>All real, from two years running RAG in social care. Corpus imbalance: whoever writes the most documents dominates what the AI &quot;knows.&quot; Source confusion and recency: similarity scores don&#39;t care about dates or authority - an old document with the right words beats a new one with different phrasing. Chunks lose position: &quot;DO NOT do X&quot; gets split from its heading and the chunk reads as an instruction to do X. Hallucination: even with real source material in front of it, the model can invent details beyond what&#39;s there. Plagiarism: without explicit instruction, the model will lift sentences verbatim from your sources - a real risk if you&#39;re generating anything public-facing.</p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Wait... where did this chunk come from?

<aside class="notes"><p><strong>Chunks need own permissions / most tools don&#39;t do this automatically</strong></p>
<p>When a document is split into chunks, each chunk needs to carry its own permissions - most tools don&#39;t do this automatically. A chunk from a restricted document can get retrieved to answer someone who shouldn&#39;t see the source document at all. This has to be designed in, not assumed from your SharePoint folder structure.</p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Metadata helps.
### But none of this is as simple as the tech makes it look.

<aside class="notes"><p><strong>Section closer / metadata = partial fix, not a cure / manage expectations</strong></p>
<p>Metadata solves some of what we just walked through - source, date, permissions. It doesn&#39;t solve all of it. Vendors sell RAG as &quot;point it at your documents, done.&quot; It isn&#39;t. That&#39;s the honest note to close this section on before moving to the legal side.</p>
</div></aside></script></section></section><section ><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ethical data use and consent

<aside class="notes"><p><strong>Section header verbatim, content corrects the framing / 4 min, shorter now</strong></p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Does your original legal basis cover the new use?

<aside class="notes"><p><strong>Purpose limitation, not basis selection / whatever justified collecting it, does it cover AI use</strong></p>
<p>You already have a legal basis for the data you hold - whatever justified collecting it in the first place, consent or otherwise, most charity data isn&#39;t actually consent-based at all. The real question is whether that existing basis still covers using this data to feed an AI system. That may be a new purpose, and purpose limitation means you can&#39;t assume yes.</p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Every new process might need a review.

<aside class="notes"><p><strong>Light touch only / DPIA update, not a new document / say briefly, move on</strong></p>
<p>Keep this light - one line, don&#39;t labour it. Every time you do something genuinely new with AI, it may need a fresh look at your Data Protection Impact Assessment. Not a new document each time, just a habit of checking rather than assuming the old sign-off still covers it.</p>
</div></aside></script></section></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Use the AI project
## to surface what needs fixing.
## <mark>Then fix it.</mark>

<aside class="notes"><p><strong>Governance forcing function / five ways covered / callback to &quot;still worth it&quot; slide</strong></p>
<p>We opened by saying this is still worth doing even knowing everything you&#39;ve just heard - here&#39;s why. You don&#39;t need to fix everything before you start. AI projects are the best-funded governance initiative most organisations will ever get - a deadline, a sponsor, an outcome the board can see. What separates the organisations that succeed is whether they&#39;re ready to act on what the project exposes.</p>
</div></aside></script></section><section ><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## How you actually start

1. Develop a policy
2. Ask your board
3. Ask your people
4. Get your use cases

<aside class="notes"><p><strong>Policy, board, people, use cases / &quot;what have you done 20+ times&quot;</strong></p>
<p>Policy first - what&#39;s allowed, what&#39;s not, what happens when something goes wrong. Then your board - have they actually signed off on this direction? Then ask your people - are they already using AI informally, and what do they think of it? Then get use cases - the best question to ask is &quot;what have you done more than 20 times?&quot; That&#39;s where the automation value actually is.</p>
</div></aside></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Then: how you mature

| Level | What it is |
|---|---|
| 1 - Write it down | Plain-text documents stating your org's intentions |
| 2 - Skills & agents | An advanced user builds a scoped agent - or Copilot agent - rolls it out |
| 3 - Build safely | Human in the loop → evals → scale |

<aside class="notes"><p><strong>L1 markdown docs / L2 scoped agent then rollout / L3 HITL to evals to scale / start small callback</strong></p>
<p>Level 1 isn&#39;t abstract policy - it&#39;s literally a folder of plain-text documents stating what your org is trying to do. This is the &quot;strategy as data&quot; point from earlier, made into the actual first move. Level 2: don&#39;t let everyone freelance prompts individually - an advanced user builds something scoped and defined, then it&#39;s rolled out. Level 3: human in the loop until you trust it, then automated evaluation, then scale. Whichever level you&#39;re at - start small. One folder. One use case. One data source.</p>
</div></aside></script></section></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## This week:

1. Pick one use case → list every data source it needs
2. Does your legal basis cover this new use?
3. Your documents: who owns them? When last reviewed?
4. Draft a one-paragraph AI policy

<aside class="notes"><p><strong>4 actions / a day each / saves weeks later</strong></p>
<p>You don&#39;t need to do all the data work first. These four steps are enough to start safely. None take more than a day each - all of them save weeks later.</p>
</div></aside></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
